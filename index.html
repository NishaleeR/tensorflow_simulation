<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gesture Doodle AI</title>

    <link rel="stylesheet" href="sytyle.css">
    <!-- MediaPipe for hand detection -->
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>

<body>

    <div class="container">

        <h1>🎨 Gesture Doodle AI</h1>
        <p class="subtitle">Draw an object and let AI recognize it</p>

        <!-- Navigation -->
        <div class="slide-nav">
            <button class="nav-btn active" data-slide="drawing">✏️ Drawing</button>
            <button class="nav-btn" data-slide="prediction">🔮 Prediction</button>
        </div>

        <!-- Slide Container -->
        <div class="slides-container">
            <!-- Drawing Slide -->
            <div class="slide active" id="drawing-slide">
                <div class="slide-content">
                    <h2>Drawing Canvas</h2>
                    <p class="slide-subtitle">Draw something and click Recognize</p>
                    
                    <div class="input-modes">
                        <button class="mode-btn active" data-mode="drawing">✏️ Draw</button>
                        <button class="mode-btn" data-mode="webcam">📷 Webcam</button>
                        <button class="mode-btn" data-mode="gesture">👋 Gesture</button>
                    </div>
                    
                    <div class="input-section active" id="drawing-mode">
                        <canvas id="drawingCanvas" width="600" height="400"></canvas>
                    </div>
                    
                    <div class="input-section" id="webcam-mode">
                        <video id="webcamVideo" width="600" height="400" autoplay playsinline></video>
                        <div id="webcamResult" class="webcam-result">Show your hand ✋</div>
                    </div>
                    
                    <div class="input-section" id="gesture-mode">
                        <canvas id="gestureCanvas" width="600" height="400"></canvas>
                        <div class="gesture-camera-container">
                            <div class="floating-handle">Gesture Camera</div>
                            <div id="gestureMessage" class="gesture-message" aria-live="polite"></div>
                            <video id="gestureVideo" width="600" height="150" autoplay playsinline></video>
                        </div>
                    </div>
                    
                    <div class="buttons">
                        <button id="webcamToggleBtn" class="btn-secondary" style="display: none;">📷 Stop Webcam</button>
                        <button id="gestureToggleBtn" class="btn-secondary" style="display: none;">👋 Stop Gesture</button>
                        <button id="undoBtn" class="btn-secondary" style="display: none;">↶ Undo</button>
                        <button id="clearBtn" class="btn-secondary">🗑️ Clear</button>
                        <button id="recognizeBtn" class="btn-primary">✅ Recognize</button>
                    </div>
                </div>
            </div>

            <!-- Prediction Slide -->
            <div class="slide" id="prediction-slide">
                <div class="slide-content">
                    <h2>AI Prediction Results</h2>
                    <p class="slide-subtitle">Your AI recognition results</p>
                    
                    <div class="prediction-box">
                        <div class="prediction-item">
                            <p class="label">Prediction</p>
                            <h3 id="prediction">---</h3>
                        </div>
                        
                        <div class="prediction-item">
                            <p class="label">Confidence Level</p>
                            <div class="confidence-bar">
                                <div id="confidence"></div>
                            </div>
                            <span id="confidenceText">0%</span>
                        </div>
                        
                        <div class="status-box">
                            <p class="model-status">🟢 TensorFlow Model: Ready</p>
                        </div>
                    </div>
                    
                    <div class="buttons">
                        <button id="backToDrawBtn" class="btn-secondary">← Back to Drawing</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
